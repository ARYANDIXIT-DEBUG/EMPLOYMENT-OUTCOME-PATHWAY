trainee:
  definition: ever_trained
  rules:
    ever_trained:
      variable: b4q12
      codes_yes:
      - '1'
    recent_completion:
      variable: b4pt1q3
      codes_yes:
      - '1'
  min_time_points: 3
  timing_support: coarse_flag
  timing_evidence:
    source: 'NADA catalogue 213 perv1 variable b4pt1q3_perv1 label: ''Whether Training
      completed during last 365 days'''
    note: 'Code 1 (completed last 365 days) confirmed from CSV cross-tab on 2026-11-05.
      Only non-blank when b4q12=1 (vocational/technical training), confirming it gates
      correctly. 2,753 records with code 1 (completed) and 10,278 with code 2 (not
      completed). Post-training wording remains BLOCKED because coarse_flag does not
      date training within the panel window.

      '
missing:
  policy: pairwise_available
  min_overlap: 2
  attr_handling:
    numeric: median
    categorical: unknown_category
  sensitivity_policies:
  - complete_cases_only
  - forward_fill
  - missing_as_state
distance:
  name: dynamic_hamming
  substitution: trate
  indel: 1.0
  attribute_inputs: []
  reduction: collapse_then_subsample
  max_n: 3000
  max_matrix_mb: 512
  peak_factor: 2.0
  block_rows: 256
