  checkpoint1_status: UNRESOLVED
  b4q12_permission_status: user_confirmed
  scope_approved: false
  period: July2023-June2024
  sector_coverage: both
  files:
  - id: perv1
    path: data/raw/perv1.csv
    release_id: DDI-IND-CSO-PLFS-2023-24
    design_id: PLFS-2023-24-rotational-panel
    period: V1
    sector: both
    kind: person
    role: primary
  - id: perrv
    path: data/raw/perrv.csv
    release_id: DDI-IND-CSO-PLFS-2023-24
    design_id: PLFS-2023-24-rotational-panel
    period: V2-V4
    sector: both
    kind: person
    role: primary
  - id: hhv1
    path: data/raw/hhv1.csv
    release_id: DDI-IND-CSO-PLFS-2023-24
    design_id: PLFS-2023-24-rotational-panel
    period: V1
    sector: both
    kind: household
    role: primary
  - id: hhrv
    path: data/raw/hhrv.csv
    release_id: DDI-IND-CSO-PLFS-2023-24
    design_id: PLFS-2023-24-rotational-panel
    period: V2-V4
    sector: both
    kind: household
    role: primary
  layouts:
    perv1:
      format: csv
      encoding: utf-8
      sep: ','
      columns:
        state:
          source: state_perv1
          label: State/UT Code
        fsu:
          source: b1q1_perv1
          label: FSU Serial Number
        sg_sb:
          source: b1q13_perv1
          label: Sample Sg/Sb No.
        stratum2:
          source: b1q14_perv1
          label: Second Stage Stratum No.
        stratum:
          source: b1q5_perv1
          label: Stratum (audit comparison; cross-visit stability rule unconfirmed)
        sub_stratum:
          source: b1q6_perv1
          label: Sub-Stratum (audit comparison; cross-visit stability rule unconfirmed)
        sub_sample:
          source: b1q11_perv1
          label: Sub-Sample (audit comparison; cross-visit stability rule unconfirmed)
        fod_sub_region:
          source: b1q12_perv1
          label: FOD Sub-Region (audit comparison; cross-visit stability rule unconfirmed)
        hh_no:
          source: b1q15_perv1
          label: Sample Household Number
        person_no:
          source: b4q1_perv1
          label: Person Serial No.
        qtr:
          source: qtr_perv1
          label: Quarter of survey (Q1=Jul-Sep 2023, Q2=Oct-Dec 2023, Q3=Jan-Mar 2024,
            Q4=Apr-Jun 2024)
        visit:
          source: visit_perv1
          label: 'Visit (values: V1)'
        sex:
          source: b4q5_perv1
          label: Gender
        age:
          source: b4q6_perv1
          label: Age
          dtype: int
        sector:
          source: b1q3_perv1
          label: Sector (1=Rural, 2=Urban)
        cws:
          source: b6q5_perv1
          label: Current Weekly Status (CWS)
        b4q12:
          source: b4q12_perv1
          label: Whether received any Vocational/Technical Training
          codes:
            '1': vocational/technical training
            '2': non-vocational formal training
            '3': training category 3
            '4': training category 4
            '5': training category 5
            '6': training category 6
          na_codes: []
        b4pt1q3:
          source: b4pt1q3_perv1
          label: Whether Training completed during last 365 days
          codes:
            '1': completed last 365 days
            '2': not completed last 365 days
          na_codes: []
        wt:
          source: mult_perv1
          label: Sub-sample wise Multiplier
          dtype: float
    perrv:
      format: csv
      encoding: utf-8
      sep: ','
      columns:
        state:
          source: state_perrv
          label: State/UT Code
        fsu:
          source: b1q1_perrv
          label: FSU Serial Number
        sg_sb:
          source: b1q13_perrv
          label: Sample Sg/Sb No.
        stratum2:
          source: b1q14_perrv
          label: Second Stage Stratum No.
        stratum:
          source: b1q5_perrv
          label: Stratum (audit comparison; cross-visit stability rule unconfirmed)
        sub_stratum:
          source: b1q6_perrv
          label: Sub-Stratum (audit comparison; cross-visit stability rule unconfirmed)
        sub_sample:
          source: b1q11_perrv
          label: Sub-Sample (audit comparison; cross-visit stability rule unconfirmed)
        fod_sub_region:
          source: b1q12_perrv
          label: FOD Sub-Region (audit comparison; cross-visit stability rule unconfirmed)
        hh_no:
          source: b1q15_perrv
          label: Sample Household Number
        person_no:
          source: b4q1_pervv
          label: 'Person Serial No. (NB: source header is b4q1_pervv — double-v)'
        qtr:
          source: qtr_perrv
          label: Quarter of survey (Q1=Jul-Sep 2023, Q2=Oct-Dec 2023, Q3=Jan-Mar 2024,
            Q4=Apr-Jun 2024)
        visit:
          source: visit_perrv
          label: 'Visit (values: V2, V3, V4)'
        sex:
          source: b4q5_perrv
          label: Gender
        age:
          source: b4q6_perrv
          label: Age
          dtype: int
        sector:
          source: b1q3_perrv
          label: Sector (1=Rural, 2=Urban)
        cws:
          source: b6q5_perrv
          label: Current Weekly Status (CWS)
        wt:
          source: mult_perrv
          label: Sub-sample wise Multiplier
          dtype: float
    hhv1:
      format: csv
      encoding: utf-8
      sep: ','
      columns:
        state:
          source: state_hhv1
        fsu:
          source: b1q1_hhv1
        visit:
          source: visit_hhv1
    hhrv:
      format: csv
      encoding: utf-8
      sep: ','
      columns:
        state:
          source: state_hhrv
        fsu:
          source: b1q1_hhrv
        visit:
          source: visit_hhrv
  design_mix_justification: null
  schema:
    household_id:
    - state
    - fsu
    - sg_sb
    - stratum2
    - hh_no
    person_id: person_no
    visit: visit
    quarter: qtr
    month: null
    sector: sector
    age: age
    sex: sex
    social_group: null
    religion: null
    weight: null
    status_col: cws
    nonresponse_col: null
    training_cols:
    - b4q12
    - b4pt1q3
  verified: false
  verified_note: 'Legacy verification note retained for audit trail only; it is not
    an attestation. Official Catalogue 213 files and CSV headers are present, but
    individual mappings, persistent person linkage, longitudinal weights, and data-use
    scope are not all validated. The broad CWS categories 11-72, 81/82, and 91-98
    follow PLFS Instruction Manual Vol. I §3.6.14; individual 91-98 labels and code
    99 remain unresolved. See reports/P4_permissions.md and reports/11_baseline_resolution.md.

    '
