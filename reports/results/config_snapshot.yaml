  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  primary: kmedoids
  comparison: hierarchical
  linkage: average
  n_init: 10
  max_iter: 100
  medoid_min_observed: all
  min_cluster_frac: 0.02
  k_rule:
